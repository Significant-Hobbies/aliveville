      html,

      /* Inline splash — visible before any JS parses */
      #splash {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(ellipse at 50% 35%, #1b2335 0%, #0c111d 70%);
        color: #f1f5fb;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0.04em;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      #splash-wordmark {
        font-family: "Cinzel", "Avenir Next", serif;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #f1ead7;
        text-shadow: 0 0 28px rgba(248, 212, 78, 0.35), 0 0 48px rgba(127, 208, 255, 0.3);
        animation: splash-pulse 1.8s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>

    <script>
      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) return;
        const tracked = event.target.closest('[data-app-health-event]');
        const name = tracked?.getAttribute('data-app-health-event');
        if (name && typeof window.appHealth?.track === 'function') window.appHealth.track(name);
      });
    </script>
