name: Deploy aliveville landing

# Rollback: Cloudflare Pages preserves every deployment. Roll back via
# dash.cloudflare.com → Pages → aliveville → Deployments → "Rollback to this
# deployment".
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prepare pinned landing pnpm
        working-directory: astro-landing
        run: |
          corepack enable
          corepack install
      - name: Install and build
        working-directory: astro-landing
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/security-policy.test.mjs
          node scripts/check-security.mjs
          pnpm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.99.0"
          # Run from astro-landing/ so wrangler finds astro-landing/functions/_middleware.ts.
          # Wrangler looks for functions/ relative to the CWD, not the deploy
          # directory — deploying from the repo root with `pages deploy astro-landing/dist`
          # silently skips the functions directory.
          workingDirectory: astro-landing
          command: pages deploy dist --project-name=aliveville --branch=main
      - name: Smoke production
        run: curl --fail --silent --show-error --location --output /dev/null --retry 3 --retry-delay 5 --max-time 20 https://aliveville.com/
